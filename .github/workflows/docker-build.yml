name: Build and Deploy

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.3.0

      - name: Build image (PR validation only)
        if: github.event_name == 'pull_request'
        run: docker compose build

      - name: Write .env file
        if: github.event_name != 'pull_request'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
          ALLOWED_USERS: ${{ secrets.ALLOWED_USERS }}
        run: |
          {
            echo "TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}"
            echo "AWS_BEARER_TOKEN_BEDROCK=${AWS_BEARER_TOKEN_BEDROCK}"
            echo "ALLOWED_USERS=${ALLOWED_USERS}"
            echo "KLEINANZEIGEN_BOT_CMD=/usr/local/bin/kleinanzeigen"
            echo "KLEINANZEIGEN_BASE_DIR=/docker-volumes/kleinanzeiger/kleinanzeigen-config"
            # nodriver's Chrome DevTools connect-retry loop (see scripts/patch_nodriver_connect_timeout.py);
            # increased from the 5x/2s/0.5s upstream defaults since this host's load can make Chrome's
            # cold start lose that race even though the browser itself works fine.
            echo "NODRIVER_CONNECT_RETRIES=5"
            echo "NODRIVER_CONNECT_TIMEOUT=60"
            echo "NODRIVER_CONNECT_RETRY_DELAY=1"
            echo "NODRIVER_CONNECT_INITIAL_DELAY=0.25"
          } > .env

      - name: Remove existing container
        if: github.event_name != 'pull_request'
        run: docker rm -f kleinanzeigen-agent || true

      - name: Build and deploy
        if: github.event_name != 'pull_request'
        env:
          COMPOSE_BAKE: "true"
        run: docker compose up --build -d --force-recreate --remove-orphans
